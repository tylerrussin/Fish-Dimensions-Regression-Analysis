# Конфигурация экспериментов лабы №2
data:
  path: "assets/data/Fish.csv"
  target: "Weight"
  test_size: 0.2
  val_size: 0.2
  random_state: 42

features:
  numeric: ["Length1", "Length2", "Length3", "Height", "Width"]
  categorical: ["Species"]

experiments:
  E0:
    name: "naive_mean"
    model: "mean"
  E1:
    name: "linear"
    model: "linear"
  E2:
    name: "ridge"
    model: "ridge"
    alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
  E3:
    name: "random_forest"
    model: "rf"
    n_estimators_grid: [50, 100, 200]
    max_depth_grid: [3, 5, 10]
  E4:
    name: "volume_feature"
    model: "ridge"
    features:
      numeric: ["Length3", "Height", "Width", "V_approx"]
      categorical: ["Species"]